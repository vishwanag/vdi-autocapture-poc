<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Car Angle Auto-Capture (98%)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #f2f4f8; text-align: center;
  }
  header { padding: 14px; background: #161a22; font-size: 18px; font-weight: 600; }
  .sub { font-size: 12px; color: #8b93a3; margin-top: 2px; }

  .sides { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
  .side-btn {
    padding: 14px 6px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: #232a36; color: #cfd6e4; cursor: pointer; transition: .15s;
  }
  .side-btn.active { background: #2f6df6; color: #fff; }
  .side-btn.done { background: #1f7a44; color: #fff; }
  .side-btn.done::after { content: " ✓"; }

  #stage { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
  video, canvas#overlay {
    width: 100%; border-radius: 12px; display: block; background: #000;
  }
  canvas#overlay { position: absolute; top: 0; left: 0; }

  .status {
    margin: 10px auto; max-width: 640px; padding: 10px 14px; border-radius: 10px;
    background: #161a22; font-size: 14px; min-height: 20px;
  }
  .conf { font-weight: 700; }
  .low { color: #f0a020; }
  .high { color: #37d67a; }

  .bar-wrap { height: 8px; background: #232a36; border-radius: 20px; overflow: hidden; margin-top: 8px; }
  .bar { height: 100%; width: 0%; background: #2f6df6; transition: width .1s; }

  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; max-width: 640px; margin: 0 auto; }
  .thumb { background: #161a22; border-radius: 10px; padding: 6px; font-size: 11px; color: #8b93a3; }
  .thumb img { width: 100%; border-radius: 6px; display: block; margin-bottom: 4px; }
  .thumb.empty { opacity: .35; padding-top: 24px; padding-bottom: 24px; }

  .actions { padding: 8px 12px 24px; }
  button.act {
    padding: 12px 20px; margin: 4px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; background: #232a36; color: #cfd6e4;
  }
  button.act.primary { background: #2f6df6; color: #fff; }
</style>
</head>
<body>

<header>
  Car Exterior Auto-Capture
  <div class="sub">Auto-captures only at ≥ 98% confidence</div>
</header>

<!-- Side selector -->
<div class="sides">
  <button class="side-btn" data-side="front">Front</button>
  <button class="side-btn" data-side="right">Right</button>
  <button class="side-btn" data-side="rear">Rear</button>
  <button class="side-btn" data-side="left">Left</button>
</div>

<!-- Camera stage -->
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<div class="status" id="status">Select a side to begin.</div>
<div class="bar-wrap" style="max-width:640px;margin:0 auto;"><div class="bar" id="bar"></div></div>

<!-- Captured thumbnails -->
<div class="thumbs" id="thumbs"></div>

<div class="actions">
  <button class="act" id="startBtn">Start Camera</button>
  <button class="act primary" id="downloadBtn">Download All</button>
</div>

<canvas id="capture" style="display:none;"></canvas>

<script>
/* =======================================================================
   ROBOFLOW CONFIG  — replace API_KEY with your own key
   ======================================================================= */
const ROBOFLOW = {
  apiKey:  "YOUR_API_KEY_HERE",                              // <-- paste your key
  model:   "car-angle-nawxj-aenjp",                          // project slug
  version: "1",                                              // model version
  // Hosted inference endpoint
  get url() { return `https://detect.roboflow.com/${this.model}/${this.version}`; }
};

const CONFIDENCE_THRESHOLD = 0.98;   // 98% strictness
const STABLE_FRAMES        = 3;      // must stay valid for N frames before capture
const INFER_INTERVAL_MS    = 350;    // time between inference calls

/* Map your model's class labels to the 4 sides.
   Edit the right-hand arrays to match how YOUR model outputs labels. */
const CLASS_MAP = {
  front: ["front"],
  right: ["right", "right-side", "right_side"],
  rear:  ["rear", "back"],
  left:  ["left", "left-side", "left_side"]
};

/* ======================================================================= */

const video     = document.getElementById("video");
const overlay   = document.getElementById("overlay");
const octx      = overlay.getContext("2d");
const capture   = document.getElementById("capture");
const statusEl  = document.getElementById("status");
const barEl     = document.getElementById("bar");
const thumbsEl  = document.getElementById("thumbs");

let stream = null;
let currentSide = null;
let stableCount = 0;
let inferBusy = false;
let loopTimer = null;
const captured = {}; // side -> dataURL

/* ---- Build thumbnail placeholders ---- */
const SIDES = ["front", "right", "rear", "left"];
function renderThumbs() {
  thumbsEl.innerHTML = "";
  SIDES.forEach(s => {
    const div = document.createElement("div");
    if (captured[s]) {
      div.className = "thumb";
      div.innerHTML = `<img src="${captured[s]}"/>${s.toUpperCase()}`;
    } else {
      div.className = "thumb empty";
      div.textContent = s.toUpperCase();
    }
    thumbsEl.appendChild(div);
  });
}
renderThumbs();

/* ---- Side selection ---- */
document.querySelectorAll(".side-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentSide = btn.dataset.side;
    stableCount = 0;
    document.querySelectorAll(".side-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    statusEl.textContent = `Point the camera at the ${currentSide.toUpperCase()} of the car…`;
    if (!stream) startCamera();
  });
});

/* ---- Camera ---- */
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    overlay.width  = video.videoWidth;
    overlay.height = video.videoHeight;
    startLoop();
  } catch (e) {
    statusEl.textContent = "Camera unavailable: " + e.message;
  }
}
document.getElementById("startBtn").addEventListener("click", startCamera);

/* ---- Inference loop ---- */
function startLoop() {
  if (loopTimer) return;
  loopTimer = setInterval(runInference, INFER_INTERVAL_MS);
}

async function runInference() {
  if (inferBusy || !currentSide || !video.videoWidth) return;
  inferBusy = true;
  try {
    // Grab frame -> base64
    capture.width  = video.videoWidth;
    capture.height = video.videoHeight;
    const cctx = capture.getContext("2d");
    cctx.drawImage(video, 0, 0, capture.width, capture.height);
    const b64 = capture.toDataURL("image/jpeg", 0.7).split(",")[1];

    const res = await fetch(`${ROBOFLOW.url}?api_key=${ROBOFLOW.apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: b64
    });
    const data = await res.json();
    handleResult(data);
  } catch (e) {
    statusEl.textContent = "Inference error: " + e.message;
  } finally {
    inferBusy = false;
  }
}

/* ---- Interpret predictions ---- */
function handleResult(data) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const preds = data.predictions || [];

  // Best prediction that maps to the currently selected side
  let best = null;
  preds.forEach(p => {
    const label = (p.class || "").toLowerCase();
    const belongsToSide = CLASS_MAP[currentSide].includes(label);
    if (belongsToSide && (!best || p.confidence > best.confidence)) best = p;
    drawBox(p, belongsToSide);
  });

  const conf = best ? best.confidence : 0;
  barEl.style.width = (conf * 100).toFixed(0) + "%";

  if (best && conf >= CONFIDENCE_THRESHOLD) {
    stableCount++;
    statusEl.innerHTML = `${currentSide.toUpperCase()} detected — ` +
      `<span class="conf high">${(conf*100).toFixed(1)}%</span> (${stableCount}/${STABLE_FRAMES})`;
    if (stableCount >= STABLE_FRAMES) autoCapture(conf);
  } else {
    stableCount = 0;
    const shown = best ? (conf*100).toFixed(1) + "%" : "no match";
    statusEl.innerHTML = `Hold steady on the ${currentSide.toUpperCase()} — ` +
      `<span class="conf low">${shown}</span> (need ≥ 98%)`;
  }
}

function drawBox(p, active) {
  const x = p.x - p.width/2, y = p.y - p.height/2;
  octx.lineWidth = 3;
  octx.strokeStyle = active ? "#37d67a" : "#f0a020";
  octx.strokeRect(x, y, p.width, p.height);
  octx.fillStyle = octx.strokeStyle;
  octx.font = "16px sans-serif";
  octx.fillText(`${p.class} ${(p.confidence*100).toFixed(0)}%`, x + 4, y + 18);
}

/* ---- Capture the frame ---- */
function autoCapture(conf) {
  const side = currentSide;
  capture.width  = video.videoWidth;
  capture.height = video.videoHeight;
  capture.getContext("2d").drawImage(video, 0, 0, capture.width, capture.height);
  captured[side] = capture.toDataURL("image/jpeg", 0.92);

  // Mark done
  const btn = document.querySelector(`.side-btn[data-side="${side}"]`);
  btn.classList.remove("active");
  btn.classList.add("done");
  statusEl.innerHTML = `✅ Captured ${side.toUpperCase()} at ` +
    `<span class="conf high">${(conf*100).toFixed(1)}%</span>`;

  currentSide = null;
  stableCount = 0;
  renderThumbs();

  // Auto-advance to next uncaptured side
  const next = SIDES.find(s => !captured[s]);
  if (next) {
    setTimeout(() => document.querySelector(`.side-btn[data-side="${next}"]`).click(), 900);
  } else {
    statusEl.textContent = "🎉 All four sides captured!";
  }
}

/* ---- Download all captured images ---- */
document.getElementById("downloadBtn").addEventListener("click", () => {
  const done = Object.keys(captured);
  if (!done.length) { statusEl.textContent = "Nothing captured yet."; return; }
  done.forEach(side => {
    const a = document.createElement("a");
    a.href = captured[side];
    a.download = `car_${side}.jpg`;
    a.click();
  });
});
</script>
</body>
</html>
