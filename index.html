<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Vehicle Exterior Auto-Capture — POC</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  :root{
    --bg:#0b0f14; --panel:#121923; --accent:#00a3e0; --good:#22c55e;
    --warn:#f59e0b; --text:#e8eef6; --muted:#8ea2b6; --line:#22303f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;}

  header{padding:10px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;}
  header .brand{font-size:11px;color:var(--muted);}

  .steps{display:flex;gap:6px;padding:10px 12px;}
  .step{flex:1;text-align:center;padding:8px 4px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);font-size:11px;color:var(--muted);
    transition:.25s;position:relative;}
  .step .ic{font-size:16px;display:block;margin-bottom:2px;}
  .step.active{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset;}
  .step.done{border-color:var(--good);color:var(--good);}
  .step.done .ic::after{content:" ✓";}

  .stage{position:relative;flex:1;background:#000;overflow:hidden;}
  video,canvas.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  canvas.overlay{pointer-events:none;}

  .guide{position:absolute;inset:8% 6%;border:2px dashed rgba(255,255,255,.55);
    border-radius:16px;pointer-events:none;transition:.2s;}
  .guide.lock{border-color:var(--good);border-style:solid;box-shadow:0 0 24px rgba(34,197,94,.5);}

  .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;pointer-events:none;}
  .hint .pill{display:inline-block;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
    padding:8px 16px;border-radius:999px;font-size:13px;border:1px solid var(--line);}
  .pill.ok{color:var(--good);border-color:var(--good);}
  .pill.warn{color:var(--warn);}

  .countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.7);}

  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}

  .tray{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);overflow-x:auto;}
  .thumb{flex:0 0 74px;height:56px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);position:relative;overflow:hidden;display:flex;
    align-items:center;justify-content:center;font-size:10px;color:var(--muted);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);
    font-size:9px;text-align:center;padding:1px;}

  .controls{padding:12px;display:flex;gap:10px;border-top:1px solid var(--line);}
  button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#001019;}
  button:disabled{opacity:.45;}

  .status{padding:6px 14px;font-size:11px;color:var(--muted);text-align:center;min-height:18px;}
  .toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .toggle input{accent-color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🚗 Exterior Auto-Capture</h1>
    <span class="brand">VDI POC · DENSO</span>
  </header>

  <div class="steps" id="steps"></div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas class="overlay" id="overlay"></canvas>
    <div class="guide" id="guide"></div>
    <div class="countdown" id="countdown"></div>
    <div class="flash" id="flash"></div>
    <div class="hint"><span class="pill" id="hint">Point at a car to begin…</span></div>
  </div>

  <div class="tray" id="tray"></div>

  <div class="status" id="status">Loading detection model…</div>

  <div class="controls">
    <label class="toggle"><input type="checkbox" id="autoToggle" checked/> Auto</label>
    <button id="manualBtn">Capture Now</button>
    <button id="downloadBtn" class="primary" disabled>Download All</button>
  </div>
</div>

<script>
const SIDES = [
  {key:'front', label:'Front', ic:'🚙'},
  {key:'left',  label:'Left',  ic:'⬅️'},
  {key:'right', label:'Right', ic:'➡️'},
  {key:'rear',  label:'Rear',  ic:'🔙'},
];

const CFG = {
  minScore: 0.60,
  minCoverage: 0.35,
  stableFrames: 12,
  countdownFrom: 3,
};

const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx    = overlay.getContext('2d');
const guide   = document.getElementById('guide');
const hint    = document.getElementById('hint');
const stepsEl = document.getElementById('steps');
const trayEl  = document.getElementById('tray');
const statusEl= document.getElementById('status');
const cdEl    = document.getElementById('countdown');
const flash   = document.getElementById('flash');
const autoToggle = document.getElementById('autoToggle');

let model = null;
let stepIndex = 0;
let stableCount = 0;
let capturing = false;
const captures = {};
const VEHICLE_CLASSES = ['car','truck','bus'];

SIDES.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className='step'; d.id='step-'+s.key;
  d.innerHTML = `<span class="ic">${s.ic}</span>${s.label}`;
  stepsEl.appendChild(d);

  const t = document.createElement('div');
  t.className='thumb'; t.id='thumb-'+s.key;
  t.innerHTML = `<span class="lbl">${s.label}</span>`;
  trayEl.appendChild(t);
});

function setActiveStep(){
  SIDES.forEach((s,i)=>{
    const el = document.getElementById('step-'+s.key);
    el.classList.toggle('active', i===stepIndex && !captures[s.key]);
    el.classList.toggle('done', !!captures[s.key]);
  });
}

async function initCamera(){
  // Clear "not secure" style errors up front
  if(!window.isSecureContext){
    statusEl.textContent = '⚠️ Not HTTPS — camera blocked by browser. Open the https:// link.';
    hint.textContent = 'Open via HTTPS to enable camera';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    overlay.width = video.videoWidth;
    overlay.height= video.videoHeight;
  }catch(e){
    let msg = '⚠️ Camera unavailable.';
    if(e.name==='NotAllowedError') msg='⚠️ Permission denied. Tap the 🔒 icon → Camera → Allow, then reload.';
    else if(e.name==='NotFoundError') msg='⚠️ No camera found on this device.';
    else if(e.name==='NotReadableError') msg='⚠️ Camera is in use by another app. Close it and reload.';
    statusEl.textContent = msg;
    hint.textContent = 'Camera unavailable';
  }
}

async function initModel(){
  try{
    model = await cocoSsd.load({base:'lite_mobilenet_v2'});
    if(window.isSecureContext) statusEl.textContent = 'Model ready · '+SIDES.length+' sides to capture';
  }catch(e){
    statusEl.textContent = '⚠️ Model failed to load (check internet).';
  }
}

function coverage(bbox){
  const cw = bbox[2]/overlay.width;
  const ch = bbox[3]/overlay.height;
  return Math.max(cw, ch);
}

async function loop(){
  if(model && video.readyState===4 && !capturing){
    const preds = await model.detect(video);
    octx.clearRect(0,0,overlay.width,overlay.height);

    let best=null;
    preds.forEach(p=>{
      if(VEHICLE_CLASSES.includes(p.class) && p.score>=CFG.minScore){
        if(!best || p.bbox[2]*p.bbox[3] > best.bbox[2]*best.bbox[3]) best=p;
      }
    });

    if(best){
      const [x,y,w,h]=best.bbox;
      const cov = coverage(best.bbox);
      const framed = cov>=CFG.minCoverage;

      octx.strokeStyle = framed?'#22c55e':'#f59e0b';
      octx.lineWidth=4; octx.strokeRect(x,y,w,h);

      if(framed){
        guide.classList.add('lock');
        stableCount++;
        const cur = SIDES[stepIndex];
        hint.className='pill ok';
        hint.textContent = `${cur.label} detected — hold steady…`;
        if(autoToggle.checked && stableCount>=CFG.stableFrames){
          await runCountdown();
        }
      }else{
        guide.classList.remove('lock');
        stableCount=0;
        hint.className='pill warn';
        hint.textContent = `Move closer — frame the ${SIDES[stepIndex].label.toLowerCase()}`;
      }
    }else{
      guide.classList.remove('lock');
      stableCount=0;
      hint.className='pill';
      hint.textContent = `Point at the ${SIDES[stepIndex].label.toLowerCase()} of the car`;
    }
  }
  requestAnimationFrame(loop);
}

function runCountdown(){
  return new Promise(res=>{
    capturing=true;
    let n=CFG.countdownFrom;
    cdEl.style.display='flex'; cdEl.textContent=n;
    const iv=setInterval(()=>{
      n--;
      if(n<=0){ clearInterval(iv); cdEl.style.display='none'; capture(); res(); }
      else cdEl.textContent=n;
    },700);
  });
}

function capture(){
  const cur = SIDES[stepIndex];
  const c=document.createElement('canvas');
  c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',0.9);
  captures[cur.key]=url;

  flash.style.transition='none'; flash.style.opacity='0.9';
  setTimeout(()=>{ flash.style.transition='opacity .5s'; flash.style.opacity='0'; },30);
  const th=document.getElementById('thumb-'+cur.key);
  th.innerHTML=`<img src="${url}"/><span class="lbl">${cur.label}</span>`;

  stableCount=0;
  guide.classList.remove('lock');
  advance();
}

function advance(){
  const next = SIDES.findIndex((s,i)=> i>stepIndex && !captures[s.key]);
  const anyLeft = SIDES.findIndex(s=>!captures[s.key]);
  if(anyLeft===-1){
    hint.className='pill ok'; hint.textContent='✅ All 4 sides captured!';
    statusEl.textContent='Inspection complete — download or retake.';
    document.getElementById('downloadBtn').disabled=false;
    capturing=false; setActiveStep(); return;
  }
  stepIndex = next!==-1 ? next : anyLeft;
  setActiveStep();
  setTimeout(()=>{ capturing=false; }, 900);
}

document.getElementById('manualBtn').onclick=()=>{ if(!capturing) capture(); };

document.getElementById('downloadBtn').onclick=()=>{
  SIDES.forEach(s=>{
    if(captures[s.key]){
      const a=document.createElement('a');
      a.href=captures[s.key];
      a.download=`car_${s.key}.jpg`;
      a.click();
    }
  });
};

trayEl.addEventListener('click',e=>{
  const t=e.target.closest('.thumb'); if(!t) return;
  const key=t.id.replace('thumb-','');
  const idx=SIDES.findIndex(s=>s.key===key);
  delete captures[key];
  t.innerHTML=`<span class="lbl">${SIDES[idx].label}</span>`;
  stepIndex=idx; capturing=false; stableCount=0;
  document.getElementById('downloadBtn').disabled=true;
  setActiveStep();
});

(async()=>{
  setActiveStep();
  await initCamera();
  await initModel();
  loop();
})();
</script>
</body>
</html>
